<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mastery Course</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;1,7..72,300;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   CSS CUSTOM PROPERTIES — Design tokens
   ============================================================ */
:root {
  /* Backgrounds */
  --bg:  #0D0D0D;
  --bg2: #141414;
  --bg3: #1C1C1C;
  --bg4: #242424;

  /* Borders */
  --border:  rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);

  /* Text */
  --text:  #F0EDE8;
  --text2: #9B9790;
  --text3: #5C5A57;

  /* Accent — gold */
  --accent:     #C8A96E;
  --accent2:    #8B6F3E;
  --accent-dim: rgba(200,169,110,0.12);
  --accent-dim2:rgba(200,169,110,0.06);

  /* Semantic colours */
  --green:     #4CAF7D;
  --green-dim: rgba(76,175,125,0.12);
  --blue:      #5B9BD5;
  --blue-dim:  rgba(91,155,213,0.12);
  --red:       #D45B5B;

  /* Phase colours */
  --phase1: #C8A96E;
  --phase2: #4CAF7D;
  --phase3: #5B9BD5;
  --phase4: #C87E4C;
  --phase5: #A06EC8;

  /* Layout */
  --sidebar-w: 260px;
  --chat-w:    360px;
  --topbar-h:  52px;

  /* Shape */
  --radius:    10px;
  --radius-lg: 16px;
  --radius-sm: 6px;

  /* Typography */
  --font-ui:   'Syne', sans-serif;
  --font-body: 'Literata', Georgia, serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-ar:   'Noto Kufi Arabic', sans-serif;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

/* Arabic body override */
body.ar { font-family: var(--font-ar); }

/* RTL support */
[lang="ar"] { direction: rtl; }

/* ============================================================
   SCROLLBAR
   ============================================================ */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

.fade-up { animation: fadeUp 0.35s ease forwards; }

/* ============================================================
   APP SHELL — 3-column flex
   ============================================================ */
.app {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  z-index: 10;
}

/* — Sidebar header / logo — */
.sidebar-header {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 3px;
}

.logo-sub {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text3);
  letter-spacing: .03em;
  line-height: 1.4;
}

/* — Progress bar — */
.progress-wrap {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.progress-label {
  font-family: var(--font-ui);
  font-size: 10px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.progress-track {
  height: 3px;
  background: var(--bg4);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 2px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  width: 0%;
}

/* Milestone dots row */
.milestone-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
}

.milestone-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bg4);
  border: 1px solid var(--border2);
  transition: all 0.3s ease;
  cursor: default;
}

.milestone-dot.done {
  background: var(--accent);
  border-color: var(--accent);
}

.milestone-dot.active {
  width: 9px;
  height: 9px;
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 6px rgba(200,169,110,0.5);
}

/* — Navigation — */
nav { flex: 1; padding: 8px 0 12px; overflow-y: auto; }

.nav-phase-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px 5px;
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text3);
  cursor: pointer;
  transition: color 0.15s;
  user-select: none;
}

.nav-phase-header:hover { color: var(--text2); }

/* Small coloured phase dot in nav */
.phase-dot-sm {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.nav-step {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 20px 6px 34px;
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--text3);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  position: relative;
  user-select: none;
}

.nav-step:hover {
  background: var(--bg3);
  color: var(--text2);
}

.nav-step.active {
  color: var(--accent);
  background: var(--accent-dim);
}

.nav-step.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

/* RTL active indicator */
[dir="rtl"] .nav-step.active::before {
  left: auto;
  right: 0;
  border-radius: 2px 0 0 2px;
}

.nav-step.completed { color: var(--text2); }

/* Step number badge in sidebar */
.step-num-sm {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  flex-shrink: 0;
  transition: all 0.2s;
}

.nav-step.completed .step-num-sm {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}

.nav-step.active .step-num-sm {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

/* — Sidebar footer — language toggle — */
.sidebar-footer {
  margin-top: auto;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.lang-btn {
  flex: 1;
  padding: 7px 4px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text3);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  letter-spacing: .04em;
}

.lang-btn:hover { background: var(--bg3); color: var(--text2); }

.lang-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

/* ============================================================
   MAIN COLUMN
   ============================================================ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* — Topbar — */
.topbar {
  height: var(--topbar-h);
  min-height: var(--topbar-h);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 40px;
  gap: 16px;
  flex-shrink: 0;
}

.topbar-title {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-sub {
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
}

.chat-toggle-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}

.chat-toggle-btn:hover { background: var(--bg3); color: var(--text); }

.chat-toggle-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

/* — Content area — */
.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 40px 48px 60px;
}

/* Inner max-width container — JS wraps content in this */
.content-inner {
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
}

/* ============================================================
   CONTENT COMPONENTS
   ============================================================ */

/* Phase hero block */
.phase-hero {
  margin-bottom: 36px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
}

.phase-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 12px;
}

.phase-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.phase-title-lg {
  font-family: var(--font-ui);
  font-size: 30px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 12px;
}

.phase-desc {
  font-size: 15px;
  color: var(--text2);
  line-height: 1.8;
  max-width: 600px;
}

/* Timeline strip */
.timeline-strip {
  display: flex;
  align-items: center;
  margin-top: 22px;
  overflow-x: auto;
  padding-bottom: 2px;
}

.tl-pill {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .05em;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  color: var(--text3);
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s;
}

.tl-pill.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}

.tl-line-sm {
  flex: 1;
  min-width: 16px;
  height: 1px;
  background: var(--border);
}

/* Card grid */
.concept-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 20px 0;
}

.concept-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  transition: border-color 0.2s, transform 0.15s;
}

.concept-card:hover {
  border-color: var(--border2);
  transform: translateY(-1px);
}

.concept-icon {
  font-size: 20px;
  margin-bottom: 8px;
  line-height: 1;
}

.concept-name {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 5px;
}

.concept-desc {
  font-size: 12px;
  color: var(--text3);
  line-height: 1.6;
}

/* Tool grid (slightly larger cards) */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin: 20px 0;
}

.tool-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  transition: border-color 0.2s;
}

.tool-card:hover { border-color: var(--border2); }
.tool-card.featured { border-color: rgba(200,169,110,0.3); }

.tool-name {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
}

.tool-category {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text3);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.tool-desc {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
}

/* Callout boxes */
.callout {
  background: var(--accent-dim2);
  border: 1px solid rgba(200,169,110,0.18);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 15px 18px;
  margin: 22px 0;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.75;
}

[dir="rtl"] .callout {
  border-left: 1px solid rgba(200,169,110,0.18);
  border-right: 3px solid var(--accent);
}

.callout strong { color: var(--accent); font-weight: 500; }

.callout-blue {
  background: var(--blue-dim);
  border-color: rgba(91,155,213,0.25);
  border-left-color: var(--blue);
}

[dir="rtl"] .callout-blue {
  border-left-color: rgba(91,155,213,0.25);
  border-right-color: var(--blue);
}

.callout-green {
  background: var(--green-dim);
  border-color: rgba(76,175,125,0.25);
  border-left-color: var(--green);
}

[dir="rtl"] .callout-green {
  border-left-color: rgba(76,175,125,0.25);
  border-right-color: var(--green);
}

/* Comparison table */
.comparison-table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 13px;
}

.comparison-table th {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

[dir="rtl"] .comparison-table th { text-align: right; }

.comparison-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
  vertical-align: top;
  line-height: 1.5;
}

.comparison-table tr:last-child td { border-bottom: none; }
.comparison-table tbody tr:hover td { background: var(--bg3); }
.comparison-table .highlight-row td { color: var(--accent); }
.comparison-table .highlight-row td strong { color: var(--accent); }

/* Badges */
.badge {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  vertical-align: middle;
  margin-left: 4px;
}

.badge-green { background: var(--green-dim);  color: var(--green); }
.badge-amber { background: var(--accent-dim); color: var(--accent); }
.badge-blue  { background: var(--blue-dim);   color: var(--blue); }

/* Exercise box */
.exercise-box {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 26px;
  margin: 26px 0;
}

.exercise-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}

.exercise-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(200,169,110,0.2);
}

[dir="rtl"] .exercise-label::after { display: none; }
[dir="rtl"] .exercise-label::before {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(200,169,110,0.2);
}

.exercise-title {
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
}

.exercise-desc {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.75;
  margin-bottom: 14px;
}

.exercise-prompt {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 8px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.complete-btn {
  margin-top: 18px;
  padding: 9px 20px;
  border-radius: var(--radius);
  border: 1px solid var(--green);
  background: var(--green-dim);
  color: var(--green);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .05em;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}

.complete-btn:hover { background: rgba(76,175,125,0.22); }
.complete-btn.done  { opacity: 0.45; cursor: default; pointer-events: none; }

/* Prose */
.prose {
  color: var(--text2);
  font-size: 15px;
  line-height: 1.85;
}

.prose p          { margin-bottom: 15px; }
.prose p:last-child { margin-bottom: 0; }
.prose strong     { color: var(--text); font-weight: 500; }
.prose em         { color: var(--accent); font-style: italic; }

/* Section divider */
.section-divider {
  height: 1px;
  background: var(--border);
  margin: 36px 0;
}

/* ============================================================
   CHAT PANEL
   ============================================================ */
.chat-panel {
  width: var(--chat-w);
  min-width: var(--chat-w);
  background: var(--bg2);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.3s ease, min-width 0.3s ease, opacity 0.3s ease;
  overflow: hidden;
}

[dir="rtl"] .chat-panel {
  border-left: none;
  border-right: 1px solid var(--border);
}

.chat-panel.hidden {
  width: 0;
  min-width: 0;
  opacity: 0;
  pointer-events: none;
}

/* Chat header */
.chat-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  flex-shrink: 0;
}

.chat-status {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  animation: pulse 2.5s ease-in-out infinite;
}

/* API key setup */
.api-setup {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.api-setup.hidden { display: none; }

.api-label {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}

.api-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 8px 11px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  margin-bottom: 8px;
  transition: border-color 0.15s;
}

.api-input:focus { border-color: var(--accent); }
.api-input::placeholder { color: var(--text3); }

.api-btn {
  width: 100%;
  padding: 8px;
  border-radius: var(--radius);
  border: none;
  background: var(--accent);
  color: #0D0D0D;
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .05em;
  cursor: pointer;
  transition: opacity 0.15s;
}

.api-btn:hover { opacity: 0.85; }

/* Chat messages */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  padding: 10px 13px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.65;

}

.send-btn:hover   { opacity: 0.85; }
.send-btn:disabled { opacity: 0.35; cursor: default; }

/* ============================================================
   TOAST NOTIFICATION
   ============================================================ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg2);
  border: 1px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: 12px 24px;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  z-index: 1000;
  transition: transform 0.35s cubic-bezier(.4,0,.2,1);
  text-align: center;
  max-width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  pointer-events: none;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ============================================================
   MOBILE RESPONSIVE — max-width: 768px
   ============================================================ */
@media (max-width: 768px) {
  /* Sidebar slides in as overlay */
  .sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    transform: translateX(-100%);
    z-index: 200;
    box-shadow: 4px 0 24px rgba(0,0,0,0.5);
  }

  [dir="rtl"] .sidebar {
    left: auto;
    right: 0;
    transform: translateX(100%);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  /* Chat panel as overlay on mobile */
  .chat-panel {
    position: fixed;
    top: 0; bottom: 0; right: 0;
    transform: translateX(100%);
    z-index: 200;
    transition: transform 0.3s ease;
    width: min(var(--chat-w), 100vw);
    min-width: 0;
    opacity: 1;
    box-shadow: -4px 0 24px rgba(0,0,0,0.5);
  }

  [dir="rtl"] .chat-panel {
    right: auto;
    left: 0;
    transform: translateX(-100%);
  }

  .chat-panel.hidden          { transform: translateX(100%); width: min(var(--chat-w), 100vw); opacity: 1; pointer-events: none; }
  .chat-panel.mobile-open     { transform: translateX(0); pointer-events: all; }

  [dir="rtl"] .chat-panel.hidden      { transform: translateX(-100%); }
  [dir="rtl"] .chat-panel.mobile-open { transform: translateX(0); }

  /* Reduced padding on small screens */
  .content-area  { padding: 24px 20px 40px; }
  .topbar        { padding: 0 16px; }

  /* Smaller heading */
  .phase-title-lg { font-size: 22px; }

  /* Single column grids */
  .concept-grid,
  .tool-grid { grid-template-columns: 1fr; }
}

const PHASES = [...PHASES_1_2, ...PHASES_3_4_5];
const L = () => state.lang;

const STORAGE_KEY = 'ai_mastery_v1';

let state = {
  lang: 'en',
  completed: {},
  currentPage: 'welcome',
  apiKey: '',
  chatHistory: []
};

const T = {
  en: {
    logoSub: 'From Zero to Creative Empire',
    progressLabel: 'Course Progress',
    chatBtn: 'Ask Claude',
    chatHeader: 'Claude — AI Assistant',
    apiLabel: 'Enter Anthropic API Key',
    apiNote: 'Your key stays only in your browser. Get it free from console.anthropic.com',
    apiStart: 'Start Chat',
    markDone: '✓ Mark as Complete',
    done: '✓ Completed',
    exercise: 'Practical Exercise',
    landscape: '🗺 Overview First'
  },
  ar: {
    logoSub: 'من الصفر إلى الإمبراطورية الإبداعية',
    progressLabel: 'التقدم في الدورة',
    chatBtn: 'اسأل كلود',
    chatHeader: 'كلود — المساعد الذكي',
    apiLabel: 'أدخل مفتاح Anthropic API',
    apiNote: 'مفتاحك يبقى في متصفحك فقط. احصل عليه مجاناً من console.anthropic.com',
    apiStart: 'ابدأ المحادثة',
    markDone: '✓ تحديد كمكتمل',
    done: '✓ مكتمل',
    exercise: 'تمرين عملي',
    landscape: '🗺 نظرة عامة أولاً'
  }
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    state = { ...state, ...saved, completed: { ...state.completed, ...(saved.completed || {}) }, chatHistory: Array.isArray(saved.chatHistory) ? saved.chatHistory : [] };
  } catch (err) { console.error('Failed to load state:', err); }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (err) { console.error('Failed to save state:', err); }
}

function totalSteps() {
  if (!Array.isArray(PHASES)) return 0;
  let count = 0;
  PHASES.forEach(phase => { if (Array.isArray(phase.steps)) count += phase.steps.length; });
  return count;
}

function completedCount() { return Object.values(state.completed).filter(Boolean).length; }

function progressPct() {
  const total = totalSteps();
  if (!total) return 0;
  return Math.round((completedCount() / total) * 100);
}

function updateProgress() {
  const pct = progressPct();
  const fill = document.getElementById('progress-fill');
  const pctText = document.getElementById('progress-pct');
  if (fill) fill.style.width = `${pct}%`;
  if (pctText) pctText.textContent = `${pct}%`;
  const dots = document.querySelectorAll('.milestone-dot');
  PHASES.forEach((ph, i) => {
    const phSteps = ph.steps.map(s => s.id);
    const phDone = phSteps.filter(id => state.completed[id]).length;
    if (dots[i]) {
      dots[i].classList.toggle('done', phDone === phSteps.length);
      dots[i].classList.toggle('active', phDone > 0 && phDone < phSteps.length);
    }
  });
}

function markComplete(stepId) {
  if (!stepId || state.completed[stepId]) return;
  state.completed[stepId] = true;
  saveState();
  updateProgress();
  if (typeof renderNav === 'function') renderNav();
  const btn = document.getElementById(`complete-btn-${stepId}`);
  if (btn) { btn.classList.add('done'); btn.textContent = T[state.lang].done; btn.disabled = true; }
  if (Array.isArray(PHASES)) {
    PHASES.forEach((phase, pi) => {
      if (!Array.isArray(phase.steps)) return;
      const inThisPhase = phase.steps.some(s => s.id === stepId);
      const allDone = phase.steps.every(s => state.completed[s.id]);
      if (inThisPhase && allDone) {
        const name = state.lang === 'ar' ? (phase.ar?.title || phase.en?.title) : (phase.en?.title || phase.ar?.title);
        showToast(`🎉 ${name} complete!`);
      }
    });
  }
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3500);
}

function navigateTo(pageId) {
  if (!pageId) return;
  state.currentPage = pageId;
  saveState();
  if (typeof renderNav === 'function') renderNav();
  if (typeof renderContent === 'function') renderContent(pageId);
  const contentArea = document.getElementById('content-area');
  if (contentArea) contentArea.scrollTo({ top: 0, behavior: 'smooth' });
  const titleEl = document.getElementById('topbar-title');
  if (titleEl) {
    if (pageId === 'welcome') {
      titleEl.textContent = state.lang === 'ar' ? 'الرئيسية' : 'Welcome';
    } else {
      let found = '';
      PHASES.forEach(ph => {
        if (`phase_${ph.id}` === pageId) found = state.lang === 'ar' ? (ph.ar?.title || ph.en?.title) : (ph.en?.title || ph.ar?.title);
        (ph.steps || []).forEach(step => {
          if (step.id === pageId) found = state.lang === 'ar' ? (step.ar?.title || step.en?.title) : (step.en?.title || step.ar?.title);
        });
      });
      titleEl.textContent = found || 'AI Mastery';
    }
  }
}

function setLang(lang) {
  if (!T[lang]) return;
  state.lang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('ar', lang === 'ar');
  const btnEn = document.getElementById('btn-en');
  const btnAr = document.getElementById('btn-ar');
  if (btnEn) btnEn.classList.toggle('active', lang === 'en');
  if (btnAr) btnAr.classList.toggle('active', lang === 'ar');
  const ids = {
    'logo-sub': 'logoSub',
    'progress-label-text': 'progressLabel',
    'chat-btn-label': 'chatBtn',
    'chat-header-text': 'chatHeader',
    'api-label-text': 'apiLabel',
    'api-note': 'apiNote',
    'api-start-btn': 'apiStart'
  };
  Object.entries(ids).forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) el.textContent = T[lang][key];
  });
  saveState();
  if (typeof renderNav === 'function') renderNav();
  if (typeof renderContent === 'function') renderContent(state.currentPage);
}

window.navigateTo = navigateTo;
window.markComplete = markComplete;
window.setLang = setLang;
window.showToast = showToast;
window.updateProgress = updateProgress;

document.addEventListener('DOMContentLoaded', () => {
  loadState();
  if (state.apiKey) {
    const apiSetup = document.getElementById('api-setup');
    const sendBtn = document.getElementById('send-btn');
    if (apiSetup) apiSetup.classList.add('hidden');
    if (sendBtn) sendBtn.disabled = false;
    window.chatReady = true;
  }
  setLang(state.lang);
  updateProgress();
  navigateTo(state.currentPage || 'welcome');
});

function renderNav() {
  const nav = document.getElementById('main-nav');
  if (!nav) return;
  const html = PHASES.map((ph, pi) => {
    const phaseTitle = ph[L()]?.title || ph.en?.title;
    const phasePageId = `phase_${ph.id}`;
    const stepsHtml = ph.steps.map((step, si) => {
      const completed = !!state.completed[step.id];
      const active = state.currentPage === step.id;
      return `<div class="nav-step ${active?'active':''} ${completed?'completed':''}" onclick="navigateTo('${step.id}')"><div class="step-num-sm">${completed?'✓':(si+1)}</div><span>${step[L()]?.title||step.en?.title}</span></div>`;
    }).join('');
    return `<div class="nav-phase"><div class="nav-phase-header ${state.currentPage===phasePageId?'active':''}" onclick="navigateTo('${phasePageId}')"><div class="phase-dot-sm" style="background:${ph.color}"></div><span>${phaseTitle}</span></div><div class="nav-steps">${stepsHtml}</div></div>`;
  }).join('');
  nav.innerHTML = html;
}

function renderContent(pageId) {
  const content = document.getElementById('content-area');
  if (!content) return;
  let html = '';
  if (pageId === 'welcome') html = renderWelcome();
  else if (pageId.startsWith('phase_')) {
    const phaseId = pageId.replace('phase_', '');
    const pi = PHASES.findIndex(p => p.id === phaseId);
    if (pi >= 0) html = renderPhase(PHASES[pi], pi);
  } else {
    let found = null;
    PHASES.forEach((ph, pi) => { ph.steps.forEach((step, si) => { if (step.id === pageId) found = {step, ph, pi, si}; }); });
    if (found) html = renderStep(found.step, found.ph, found.pi, found.si);
  }
  content.innerHTML = html || '<div class="fade-up">Not found</div>';
}

function renderWelcome() {
  const isAr = L() === 'ar';
  const timeline = PHASES.map((ph, i) => `<div class="tl-pill ${i===0?'active':''}" onclick="navigateTo('phase_${ph.id}')" style="cursor:pointer">${ph[L()]?.title||ph.en?.title}</div>${i<PHASES.length-1?'<div class="tl-line-sm"></div>':''}`).join('');
  const cards = PHASES.map((ph, i) => {
    const d = ph[L()] || ph.en;
    return `<div class="concept-card" onclick="navigateTo('phase_${ph.id}')" style="cursor:pointer;border-left:3px solid ${ph.color}"><div class="concept-name" style="color:${ph.color}">${isAr?'المرحلة':'Phase'} ${i+1} · ${d.title}</div><div class="concept-desc">${d.sub||''}</div><div class="concept-desc" style="margin-top:6px">${(d.desc||'').substring(0,80)}...</div></div>`;

}

function renderPhase(ph, pi) {
  const d = ph[L()] || ph.en;
  const isAr = L() === 'ar';
  const doneCount = ph.steps.filter(s => state.completed[s.id]).length;
  const cards = ph.steps.map((step, si) => {
    const sd = step[L()] || step.en;
    const done = !!state.completed[step.id];
    return `<div class="concept-card" onclick="navigateTo('${step.id}')" style="cursor:pointer;${done?'border-color:var(--green)':''}"><div class="concept-name" style="color:${done?'var(--green)':ph.color}">${done?'✓ '+(isAr?'مكتمل':'Complete'):`${isAr?'الخطوة':'Step'} ${si+1}`}</div><div class="concept-name">${sd.title}</div><div class="concept-desc">${sd.sub||''}</div></div>`;
  }).join('');
  return `<div class="fade-up"><div class="phase-hero"><div class="phase-eyebrow"><div class="phase-dot" style="background:${ph.color}"></div><span style="color:${ph.color}">${isAr?'المرحلة':'Phase'} ${pi+1}</span></div><h1 class="phase-title-lg">${d.title}</h1><p class="phase-desc">${d.desc||''}</p><div style="font-family:var(--font-ui);font-size:12px;color:var(--text3);margin-top:12px">${doneCount}/${ph.steps.length} ${isAr?'خطوات مكتملة':'steps complete'} · ${d.sub||''}</div></div><div class="concept-grid">${cards}</div></div>`;
}

function renderStep(step, ph, pi, si) {
  const d = step[L()] || step.en;
  const isAr = L() === 'ar';
  const completed = !!state.completed[step.id];

  const landscapeSection = d.landscape ? `<div class="step-section"><div class="exercise-label">${T[L()].landscape}</div><div class="prose">${d.landscape}</div>${d.landscapeGrid?.length?`<div class="concept-grid">${d.landscapeGrid.map(c=>`<div class="concept-card"><div class="concept-icon">${c.icon||'•'}</div><div class="concept-name">${c.name||c.title||''}</div><div class="concept-desc">${c.desc||''}</div></div>`).join('')}</div>`:''}</div>` : '';

    } else {
      comparisonSection = `<div class="step-section"><div class="exercise-label">${d.comparisonTitle||'Tool Comparison'}</div><table class="comparison-table"><thead><tr><th>${isAr?'الأداة':'Tool'}</th><th>${isAr?'القوة':'Strength'}</th><th>${isAr?'الأفضل لـ':'Best For'}</th></tr></thead><tbody>${d.comparison.map(r=>`<tr class="${r.badge&&r.badge!==''?'highlight-row':''}"><td><strong>${r.name||''}</strong></td><td>${r.strength||''}</td><td>${r.best||r.bestFor||''}</td></tr>`).join('')}</tbody></table></div>`;
    }
  }

  const calloutSection = d.callout ? `<div class="callout">${d.callout}</div>` : '';

  const exDone = !!state.completed[step.id];

  const exerciseSection = `<div class="exercise-box">
<div class="exercise-label">${T[L()].exercise}</div>

<div class="practice-area">

  <div class="practice-input-wrap">

      ${exDone?'disabled':''}
      onkeydown="if(event.ctrlKey&&event.key==='Enter'){submitExercise('${step.id}');}"
    ></textarea>

      ${exDone?'disabled':''}
    >${isAr?'إرسال ↑':'Submit ↑'}</button>
  </div>
  <div class="practice-hint">${isAr?'Ctrl+Enter للإرسال • يحتاج مفتاح API في لوحة المساعد':'Ctrl+Enter to submit • Requires API key in the assistant panel'}</div>

  const prev = idx > 0 ? allSteps[idx-1] : null;
  const next = idx < allSteps.length-1 ? allSteps[idx+1] : null;
  const navSection = `<div style="display:flex;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid var(--border)">${prev?`<button onclick="navigateTo('${prev.id}')" style="padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--font-ui);font-size:13px;cursor:pointer">← ${isAr?'السابق':'Previous'}</button>`:'<div></div>'}${next?`<button onclick="navigateTo('${next.id}')" style="padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--font-ui);font-size:13px;cursor:pointer">${isAr?'التالي':'Next'} →</button>`:'<div></div>'}</div>`;

  setTimeout(() => bindCompleteBtn(step.id), 0);

  return `<div class="fade-up"><div class="phase-hero" style="margin-bottom:28px;padding-bottom:20px"><div class="phase-eyebrow"><div class="phase-dot" style="background:${ph.color}"></div><span style="color:${ph.color};cursor:pointer" onclick="navigateTo('phase_${ph.id}')">${ph[L()]?.title||ph.en?.title}</span><span style="color:var(--text3)"> / ${isAr?'الخطوة':'Step'} ${si+1}</span></div><h1 class="phase-title-lg" style="font-size:24px">${d.title}</h1><p class="phase-desc" style="font-size:14px">${d.sub||''}</p></div>${landscapeSection}${contentSection}${comparisonSection}${calloutSection}${exerciseSection}${navSection}</div>`;
}

function bindCompleteBtn(stepId) {
  const btn = document.getElementById(`complete-btn-${stepId}`);
  if (!btn || state.completed[stepId]) return;
  btn.onclick = () => markComplete(stepId);
}

window.renderNav = renderNav;
window.renderContent = renderContent;
window.renderWelcome = renderWelcome;
window.renderPhase = renderPhase;
window.renderStep = renderStep;
window.bindCompleteBtn = bindCompleteBtn;

let chatReady = false;

function toggleChat() {
  const chatPanel = document.getElementById('chat-panel');
  const chatToggle = document.getElementById('chat-toggle');

  if (!chatPanel || !chatToggle) return;

  if (window.innerWidth < 768) {
    chatPanel.classList.toggle('mobile-open');
  } else {
    chatPanel.classList.toggle('hidden');
    chatToggle.classList.toggle('active');
  }
}

function startChat() {
  const input = document.getElementById('api-key-input');
  const key = input ? input.value.trim() : '';

  if (!key.startsWith('sk-')) {
    alert(state.lang === 'ar' ? 'يرجى إدخال مفتاح API صحيح يبدأ بـ sk-' : 'Please enter a valid API key starting with sk-');
    return;
  }

  state.apiKey = key;
  saveState();

  const apiSetup = document.getElementById('api-setup');
  if (apiSetup) apiSetup.classList.add('hidden');

  const sendBtn = document.getElementById('send-btn');
  if (sendBtn) sendBtn.disabled = false;

  chatReady = true;

  const welcomeMsg = state.lang === 'ar' 
    ? 'أهلاً بك! أنا كلود، مساعدك الذكي في هذه الدورة. كيف يمكنني مساعدتك اليوم؟' 
    : "Hello! I'm Claude, your AI assistant for this course. How can I help you today?";
  
  addMsg('assistant', welcomeMsg);
}

function addMsg(role, text) {
  const chatMessages = document.getElementById('chat-messages');
  if (!chatMessages) return;

  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${role} fade-up`;

  // Basic Markdown-lite handling
  let formattedText = text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .split(String.fromCharCode(10)).join('<br>');

  msgDiv.innerHTML = formattedText;
  chatMessages.appendChild(msgDiv);

  chatMessages.scrollTo({
    top: chatMessages.scrollHeight,
    behavior: 'smooth'
  });
}

function addTyping() {
  const chatMessages = document.getElementById('chat-messages');
  if (!chatMessages) return null;

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg assistant typing-indicator';
  typingDiv.id = 'typing-indicator';
  typingDiv.innerHTML = '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
  
  chatMessages.appendChild(typingDiv);
  chatMessages.scrollTo({
    top: chatMessages.scrollHeight,
    behavior: 'smooth'
  });

  return typingDiv;
}

async function sendMsg() {
  if (!chatReady) return;

  const input = document.getElementById('chat-input');
  const text = input ? input.value.trim() : '';
  const sendBtn = document.getElementById('send-btn');

  if (!text) return;

  input.value = '';
  addMsg('user', text);
  state.chatHistory.push({ role: 'user', content: text });

  const typingIndicator = addTyping();
  if (sendBtn) sendBtn.disabled = true;

  const systemPrompt = state.lang === 'ar'
    ? "أنت كلود، مساعد ذكاء اصطناعي متكامل مدمج في دورة إتقان الذكاء الاصطناعي. ساعد المستخدم في أي شيء — أسئلة الدورة، التمارين، أسئلة الحياة، نصائح الأعمال، أو أي موضوع. كن مباشراً وصادقاً ومفيداً حقاً. عندما يكون ذلك مناسباً، اربط إجاباتك بما يتعلمونه في الدورة."
    : "You are Claude, a full AI assistant embedded inside the AI Mastery course. Help the user with anything — course questions, exercises, life questions, business advice, or any topic. Be direct, honest, and genuinely helpful. When relevant, connect your answers to what they are learning in the course.";

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', // Using the latest available stable model
        max_tokens: 1000,
        system: systemPrompt,
        messages: state.chatHistory.slice(-20).map(m => ({ role: m.role, content: m.content }))
      })
    });

    const data = await response.json();

    if (typingIndicator) typingIndicator.remove();

    if (data.content && data.content[0] && data.content[0].text) {
      const reply = data.content[0].text;
      addMsg('assistant', reply);
      state.chatHistory.push({ role: 'assistant', content: reply });
    } else {
      throw new Error(data.error?.message || 'Unknown error');
    }

  } catch (error) {
    if (typingIndicator) typingIndicator.remove();
    const errorMsg = state.lang === 'ar' 
      ? 'عذراً، حدث خطأ أثناء الاتصال بكلود. يرجى التحقق من مفتاح الـ API الخاص بك.' 
      : 'Sorry, an error occurred while connecting to Claude. Please check your API key.';
    addMsg('system', errorMsg);
    console.error('Chat Error:', error);
  }

  state.chatHistory = state.chatHistory.slice(-40);
  if (sendBtn) sendBtn.disabled = false;
  saveState();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
}

// Expose to window scope
window.toggleChat = toggleChat;
window.startChat = startChat;
window.addMsg = addMsg;
window.addTyping = addTyping;
window.sendMsg = sendMsg;
window.handleKey = handleKey;
window.chatReady = chatReady;

// ══════════════════════════════════════════════════════════════
// Interactive Exercise Engine
// ══════════════════════════════════════════════════════════════

const _exHistory = {}; // stepId -> [{role, content}]

function _findStep(stepId) {
  let found = null;
  (PHASES || []).forEach(ph => {
    (ph.steps || []).forEach(s => { if (s.id === stepId) found = { step: s, phase: ph }; });
  });
  return found;
}

function _exScroll(histEl) {
  if (histEl) histEl.scrollTop = histEl.scrollHeight;
}

function _addExMsg(histEl, role, text, verdict) {
  const div = document.createElement('div');
  div.className = 'ex-msg ' + (role === 'user' ? 'ex-msg-user' : 'ex-msg-ai');
  if (role === 'assistant') {
    // Format markdown-lite
    let html = text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .split(String.fromCharCode(10)).join('<br>');
    div.innerHTML = html;
    if (verdict) {
      const badge = document.createElement('div');
      badge.className = 'verdict-badge ' + (verdict === 'PASS' ? 'verdict-pass' : 'verdict-retry');
      badge.textContent = verdict === 'PASS'
        ? (state.lang === 'ar' ? '✓ أحسنت — تم إتقان المهارة' : '✓ Well done — skill mastered')
        : (state.lang === 'ar' ? '↩ حاول مرة أخرى' : '↩ Try again');
      div.appendChild(document.createElement('br'));
      div.appendChild(badge);
    }
  } else {
    div.textContent = text;
  }
  histEl.appendChild(div);
  _exScroll(histEl);
}

async function submitExercise(stepId) {
  if (!state.apiKey) {
    showToast(state.lang === 'ar'
      ? 'أدخل مفتاح API أولاً في لوحة المساعد'
      : 'Please enter your API key in the assistant panel first');
    return;
  }

  const inputEl   = document.getElementById('pi-' + stepId);
  const submitBtn = document.getElementById('ps-' + stepId);
  const histEl    = document.getElementById('ph-' + stepId);
  if (!inputEl || !submitBtn || !histEl) return;

  const userText = inputEl.value.trim();
  if (!userText) return;

  // Find step metadata
  const found = _findStep(stepId);
  if (!found) return;
  const { step, phase } = found;
  const lang = state.lang;
  const d = step[lang] || step.en;
  const phD = phase[lang] || phase.en;

  // Record + display user message
  if (!_exHistory[stepId]) _exHistory[stepId] = [];
  _exHistory[stepId].push({ role: 'user', content: userText });
  _addExMsg(histEl, 'user', userText);
  inputEl.value = '';
  submitBtn.disabled = true;
  inputEl.disabled = true;

  // Thinking indicator
  const thinkEl = document.createElement('div');
  thinkEl.className = 'practice-thinking';
  thinkEl.innerHTML = '<div class="think-dot"></div><div class="think-dot"></div><div class="think-dot"></div><span>'
    + (lang === 'ar' ? 'كلود يراجع محاولتك...' : 'Claude is reviewing your attempt...') + '</span>';
  histEl.appendChild(thinkEl);
  _exScroll(histEl);

  // Build educator system prompt
  const systemPrompt = `You are an expert AI skills educator reviewing a student's practice exercise attempt. 
Be encouraging, specific, and constructive. Teach through feedback, not just grades.

COURSE CONTEXT:
Phase: ${phD.title || ''}
Step: ${d.title || ''}
Skill being practiced: ${d.exercise?.title || d.title || ''}
Exercise description: ${d.exercise?.desc || ''}

YOUR EVALUATION TASK:
1. Read the student's attempt carefully
2. Evaluate whether it demonstrates the skill described above
3. Give specific, actionable feedback (2-4 sentences) — what they did well, what could be stronger
4. If this is a retry, acknowledge improvement from the previous attempt
5. On a NEW LINE at the very end, write exactly one of these two lines (nothing else on that line):
   VERDICT: PASS
   VERDICT: RETRY

A PASS means the attempt is good enough to demonstrate the skill — it doesn't need to be perfect.
A RETRY means there's a clear gap that the student should address with another attempt.

Keep your response concise (under 120 words). Respond in ${lang === 'ar' ? 'Arabic' : 'English'}.`;

  // Build messages array (include prior turns for retry context)
  const messages = _exHistory[stepId].slice(); // copy

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 400,
        system: systemPrompt,
        messages: messages
      })
    });

    thinkEl.remove();

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      _addExMsg(histEl, 'assistant', 'API error: ' + (err.error?.message || resp.status));
      submitBtn.disabled = false;
      inputEl.disabled = false;
      return;
    }

    const data = await resp.json();
    const raw = data.content?.[0]?.text || '';

    // Parse verdict
    const verdictMatch = raw.match(/VERDICT:\s*(PASS|RETRY)/i);
    const verdict = verdictMatch ? verdictMatch[1].toUpperCase() : null;

    // Strip verdict line from display text
    const displayText = raw.replace(/\n?VERDICT:\s*(PASS|RETRY)\s*$/i, '').trim();

    // Record assistant response
    _exHistory[stepId].push({ role: 'assistant', content: raw });

    _addExMsg(histEl, 'assistant', displayText, verdict);

    if (verdict === 'PASS') {
      // Mark step complete
      markComplete(stepId);
      submitBtn.disabled = true;
      inputEl.disabled = true;
      inputEl.placeholder = lang === 'ar' ? '✓ تم إتقان هذه المهارة' : '✓ Skill mastered';
    } else {
      // Allow retry
      submitBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.placeholder = lang === 'ar' ? 'راجع الملاحظات وحاول مرة أخرى...' : 'Review the feedback and try again...';
      inputEl.focus();
    }

  } catch (err) {
    thinkEl.remove();
    _addExMsg(histEl, 'assistant', 'Connection error: ' + err.message);
    submitBtn.disabled = false;
    inputEl.disabled = false;
  }
}

window.submitExercise = submitExercise;
</script>
